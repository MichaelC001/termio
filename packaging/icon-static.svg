<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1024" height="1024" role="img" aria-label="termio">
  <title>termio</title>

  <defs>
    <!-- dark backdrop the glass sits against -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141417"/>
      <stop offset="0.55" stop-color="#08080a"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="0.5" cy="0.36" r="0.62">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- frosted white glass, falling to grey at the bottom so it keeps its depth
         instead of reading as flat white plastic -->
    <linearGradient id="glassFill" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#f2f2f4" stop-opacity="0.97"/>
      <stop offset="1" stop-color="#a9a9b0" stop-opacity="0.97"/>
    </linearGradient>
    <!-- specular sheen hugging the top edge -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="0.38" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- glass thickness: shadow pooling at the inner bottom edge -->
    <linearGradient id="innerShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.24"/>
    </linearGradient>
    <!-- a thin edge, brightest where the light enters at the top, catching a
         little again at the bottom; a wide band read as an outline -->
    <linearGradient id="rim" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.5"/>
    </linearGradient>

    <filter id="cast" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <!-- the prompt sits in the glass rather than on it: a light catch under its
         lower edge -->
    <filter id="inset" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset in="SourceAlpha" dy="1.6" result="offset"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.55"/>
      <feComposite in2="offset" operator="in" result="catch"/>
      <feMerge><feMergeNode in="catch"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- 海棠: the four-lobed opening of a Chinese lattice window, the union of four
         circles traced through the outer cusps. Lobe offset 83.9 and radius 81.2
         scale together, so a resize keeps the cusps' depth. -->
    <path id="haitang" d="M337.12,174.88 A81.16,81.16 0 1 1 337.12,337.12 A81.16,81.16 0 1 1 174.88,337.12 A81.16,81.16 0 1 1 174.88,174.88 A81.16,81.16 0 1 1 337.12,174.88Z"/>
    <clipPath id="haitangClip"><use href="#haitang"/></clipPath>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="114" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="114" fill="url(#bgGlow)"/>

  <use href="#haitang" fill="url(#glassFill)" filter="url(#cast)"/>
  <g clip-path="url(#haitangClip)">
    <rect width="512" height="512" fill="url(#innerShade)"/>
    <rect width="512" height="512" fill="url(#sheen)" opacity="0.6" filter="url(#soften)"/>
    <use href="#haitang" fill="none" stroke="url(#rim)" stroke-width="2.6"/>
  </g>

  <!-- >_ in font units, y up. The ">" is Monaspace Radon ExtraBold (SIL Open Font
       License, github.com/githubnext/monaspace). Its own "_" is only 0.6x as thick
       as the ">" arms, so the underscore is redrawn as a bar exactly as thick as
       the arms, standing on the same floor. ExtraBold alone vanished at Dock
       sizes, so a same-colour outline of 150 font units thickens both glyphs
       without changing their shape. -->
  <path d="M330 9 1080 555V790L330 1336L170 1117L773 678V667L170 228Z M1146.3,9.0 L2206.3,9.0 L2206.3,280.2 L1146.3,280.2Z"
        fill="#151518" stroke="#151518" stroke-width="150" stroke-linejoin="miter" stroke-miterlimit="4"
        transform="matrix(0.07135,0,0,-0.07135,171.22,303.99)" filter="url(#inset)"/>
</svg>
