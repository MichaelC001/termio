<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1024" height="1024" role="img" aria-label="termio">
  <title>termio</title>

  <defs>
    <!-- dark backdrop the glass refracts against -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141417"/>
      <stop offset="0.55" stop-color="#08080a"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="0.5" cy="0.36" r="0.62">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- frosted body: milky white, brighter at the top-left where light enters.
         Frosted glass scatters light, so over black it reads as a light, milky
         grey rather than a dark pane. -->
    <linearGradient id="glassFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.82"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.74"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.66"/>
    </linearGradient>
    <!-- edge light: bright rim along the top, fading down the sides -->
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>
    <!-- specular sheen hugging the top edge -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="0.32" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- glass thickness: shadow pooling at the inner bottom edge -->
    <linearGradient id="innerShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.22"/>
    </linearGradient>

    <filter id="cast" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="soften" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>

    <!-- one frosted-glass tile, 80x80, reused for every cell -->
    <g id="tile">
      <rect width="80" height="80" rx="19" fill="url(#glassFill)" filter="url(#cast)"/>
      <rect width="80" height="80" rx="19" fill="url(#innerShade)"/>
      <rect x="3" y="3" width="74" height="74" rx="16" fill="url(#sheen)" filter="url(#soften)"/>
      <rect x="0.8" y="0.8" width="78.4" height="78.4" rx="18.4"
            fill="none" stroke="url(#rim)" stroke-width="1.4"/>
    </g>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="114" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="114" fill="url(#bgGlow)"/>

  <!-- 九宫格. Per-tile opacity freezes the comet spinner: a full-strength leader
       at top-left fades clockwise, so even a still icon reads as streaming.
       Dim tiles simply look like glass catching less light. -->
  <g transform="translate(256 256) scale(0.9) translate(-256 -256)">
    <use href="#tile" x="216" y="216" opacity="0.95"/>

    <use href="#tile" x="116" y="116" opacity="1.00"/>
    <use href="#tile" x="216" y="116" opacity="0.82"/>
    <use href="#tile" x="316" y="116" opacity="0.66"/>
    <use href="#tile" x="316" y="216" opacity="0.53"/>
    <use href="#tile" x="316" y="316" opacity="0.44"/>
    <use href="#tile" x="216" y="316" opacity="0.37"/>
    <use href="#tile" x="116" y="316" opacity="0.32"/>
    <use href="#tile" x="116" y="216" opacity="0.29"/>
  </g>
</svg>
