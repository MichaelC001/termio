<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1284px; height: 2778px; overflow: hidden; }
  body {
    background: #0a0f16 url("src/aurora-bg.png") center / cover no-repeat;
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif;
    position: relative;
  }
  .caption {
    position: absolute;
    top: 130px;
    left: 118px;
    right: 118px;
    letter-spacing: -0.6px;
  }
  .caption h1 {
    font-size: 88px;
    line-height: 1.18;
    font-weight: 700;
    color: #F4F5F4;
  }
  .caption p {
    font-size: 88px;
    line-height: 1.18;
    font-weight: 500;
    color: rgba(214, 220, 228, 0.62);
    max-width: 1040px;
  }
  /* Identical geometry on every panel: the screen well is a fixed 2260px
     window and the source screenshot covers it from the top, so mixed
     source resolutions can never change the device's size or position. */
  .device {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    top: 620px;
    width: 1160px;
    background: #050507;
    border-radius: 172px;
    padding: 26px;
    border: 3px solid rgba(255, 255, 255, 0.22);
    box-shadow: 0 70px 160px rgba(0, 0, 0, 0.55);
  }
  .screen {
    border-radius: 146px;
    overflow: hidden;
    background: #000;
    height: 2260px;
  }
  .screen img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top;
  }
  .btn {
    position: absolute; right: -8px; width: 8px; border-radius: 0 4px 4px 0;
    background: #3d3d41;
  }
  .btn.power { top: 560px; height: 190px; }
  .btnl {
    position: absolute; left: -8px; width: 8px; border-radius: 4px 0 0 4px;
    background: #3d3d41;
  }
  .btnl.vol1 { top: 420px; height: 110px; }
  .btnl.vol2 { top: 560px; height: 110px; }
  .btnl.action { top: 300px; height: 70px; }
</style>
</head>
<body>
  <div class="caption">
    <h1>__HEADLINE__</h1>
    <p>__SUBLINE__</p>
  </div>
  <div class="device">
    <div class="btnl action"></div>
    <div class="btnl vol1"></div>
    <div class="btnl vol2"></div>
    <div class="btn power"></div>
    <div class="screen"><img src="src/__IMAGE__"></div>
  </div>
</body>
</html>
