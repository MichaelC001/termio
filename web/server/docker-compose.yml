# Local stack for termio's web: Postgres + the Hono API + the Next.js landing page.
# Bring it up with `docker compose up --build`. The landing page is served on
# http://localhost:3001 and talks to the API at http://localhost:8787.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: termio
      POSTGRES_PASSWORD: termio
      POSTGRES_DB: termio
    ports:
      - "5432:5432"
    # Postgres 18+ images store data under a major-version subdirectory, so the
    # volume mounts at /var/lib/postgresql (not /data) per the upstream guidance.
    volumes:
      - termio-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U termio -d termio"]
      interval: 3s
      timeout: 3s
      retries: 20

  server:
    build: .
    depends_on:
      db:
        condition: service_healthy
    # Reuse the existing .env for the secret and OAuth/Stripe keys, but override
    # the connection string and URLs so they resolve inside the compose network
    # (db is reachable by service name) and from the host browser.
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://termio:termio@db:5432/termio
      BETTER_AUTH_URL: http://localhost:8787
      WEB_ORIGIN: http://localhost:3001
      PORT: "8787"
    ports:
      - "8787:8787"

  landing:
    build:
      # The landing page lives in a sibling directory; bake in the browser-facing
      # API URL at build time since NEXT_PUBLIC_* values are inlined then.
      context: ../landing
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8787
    depends_on:
      - server
    # Host 3001 -> container 3000, matching the API's WEB_ORIGIN so CORS/cookies work.
    ports:
      - "3001:3000"

volumes:
  termio-pgdata:
